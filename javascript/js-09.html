<!DOCTYPE html>
<html>
<head>
<title>JS 09</title>
<link rel="stylesheet" href="../styles/style.css">
</head>
<body>

<section class="hero">

<h1>Palindrome Checker</h1>

<input id="word" placeholder="Enter Text">

<br><br>

<button class="btn" onclick="check()">Check</button>

<h2 id="ans"></h2>

<a class="btn" href="index.html">Back</a>

</section>

<script>
function check(){

let str=word.value;

let rev=str.split("").reverse().join("");

ans.innerHTML=(str==rev)?"Palindrome":"Not Palindrome";

}
</script>

</body>
</html>
