<!DOCTYPE html>
<html>
<head>
<title>JS 04</title>
<link rel="stylesheet" href="../styles/style.css">
</head>
<body>

<section class="hero">

<h1>Largest Number</h1>

<input id="x" type="number" placeholder="A"><br><br>

<input id="y" type="number" placeholder="B"><br><br>

<input id="z" type="number" placeholder="C"><br><br>

<button class="btn" onclick="largest()">Find</button>

<h2 id="res"></h2>

<a class="btn" href="index.html">Back</a>

</section>

<script>
function largest(){

let a=Number(x.value);

let b=Number(y.value);

let c=Number(z.value);

let max=Math.max(a,b,c);

res.innerHTML="Largest = "+max;

}
</script>

</body>
</html>
