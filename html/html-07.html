<!DOCTYPE html>
<html>
<head>
    <title>HTML 07 - Audio Video</title>
    <link rel="stylesheet" href="../styles/style.css">
    <style>
        .media{
            max-width:700px;
            margin:auto;
            text-align:center;
        }
        audio,video{
            width:100%;
            margin:15px 0;
        }
    </style>
</head>
<body>

<header class="navbar">
    <div class="logo">HTML 07</div>
</header>

<section class="hero">
    <h1>Audio & Video</h1>
</section>

<div class="media">

    <h3>Audio</h3>

    <audio controls>
        <source src="../assets/audio/sample.mp3" type="audio/mpeg">
    </audio>

    <h3>Video</h3>

    <video controls>
        <source src="../assets/video/sample.mp4" type="video/mp4">
    </video>

    <a class="btn" href="index.html">Back</a>

</div>

</body>
</html>
