<!DOCTYPE html>
<html>
<head>
<title>CSS 06</title>
<link rel="stylesheet" href="../styles/style.css">
<style>
.card{
width:250px;
margin:auto;
background:white;
padding:30px;
border-radius:15px;
text-align:center;
transition:.3s;
}
.card:hover{
transform:scale(1.08);
box-shadow:0 15px 25px rgba(0,0,0,.2);
}
</style>
</head>
<body>

<section class="hero">
<h1>Hover Effect</h1>
</section>

<div class="card">
<h2>Hover Me</h2>
<p>Move mouse over this card.</p>
</div>

<div style="text-align:center;margin:20px;">
<a class="btn" href="index.html">Back</a>
</div>

</body>
</html>
