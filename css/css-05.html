<!DOCTYPE html>
<html>
<head>
<title>CSS 05</title>
<link rel="stylesheet" href="../styles/style.css">
<style>
.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
max-width:700px;
margin:auto;
}
.box{
background:#10b981;
color:white;
padding:40px;
text-align:center;
border-radius:8px;
font-size:22px;
}
</style>
</head>
<body>

<section class="hero">
<h1>CSS Grid</h1>
</section>

<div class="grid">
<div class="box">A</div>
<div class="box">B</div>
<div class="box">C</div>
<div class="box">D</div>
<div class="box">E</div>
<div class="box">F</div>
</div>

<div style="text-align:center;margin:20px;">
<a class="btn" href="index.html">Back</a>
</div>

</body>
</html>
