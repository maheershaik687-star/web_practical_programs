<!DOCTYPE html>
<html>
<head>
<title>CSS 09</title>
<link rel="stylesheet" href="../styles/style.css">
<style>
.ball{
width:80px;
height:80px;
background:crimson;
border-radius:50%;
position:relative;
animation:bounce 2s infinite;
margin:auto;
}
@keyframes bounce{
0%{top:0;}
50%{top:180px;}
100%{top:0;}
}
</style>
</head>
<body>

<section class="hero">
<h1>CSS Animation</h1>
</section>

<div style="height:260px;">
<div class="ball"></div>
</div>

<div style="text-align:center;">
<a class="btn" href="index.html">Back</a>
</div>

</body>
</html>
