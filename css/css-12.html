<!DOCTYPE html>
<html>
<head>
<title>CSS 12</title>
<link rel="stylesheet" href="../styles/style.css">
<style>
.login{
width:320px;
margin:auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 10px 20px rgba(0,0,0,.2);
}
.login input{
width:100%;
padding:12px;
margin:10px 0;
}
.login button{
width:100%;
padding:12px;
background:#2563eb;
color:white;
border:none;
}
</style>
</head>
<body>

<section class="hero">
<h1>Login Form</h1>
</section>

<div class="login">
<h2>Login</h2>
<input type="email" placeholder="Email">
<input type="password" placeholder="Password">
<button>Login</button>
</div>

<div style="text-align:center;margin-top:20px;">
<a class="btn" href="index.html">Back</a>
</div>

</body>
</html>
