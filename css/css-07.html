<!DOCTYPE html>
<html>
<head>
<title>CSS 07</title>
<link rel="stylesheet" href="../styles/style.css">
<style>
.buttons{
text-align:center;
}
button{
margin:10px;
padding:15px 30px;
border:none;
cursor:pointer;
font-size:18px;
border-radius:30px;
transition:.3s;
}
.primary{
background:#2563eb;
color:white;
}
.success{
background:#16a34a;
color:white;
}
.danger{
background:#dc2626;
color:white;
}
button:hover{
opacity:.8;
transform:translateY(-4px);
}
</style>
</head>
<body>

<section class="hero">
<h1>Styled Buttons</h1>
</section>

<div class="buttons">
<button class="primary">Primary</button>
<button class="success">Success</button>
<button class="danger">Danger</button>
</div>

<div style="text-align:center;margin-top:30px;">
<a class="btn" href="index.html">Back</a>
</div>

</body>
</html>
