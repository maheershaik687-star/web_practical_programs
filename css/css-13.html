<!DOCTYPE html>
<html>
<head>
<title>CSS 13</title>
<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#667eea,#764ba2);
font-family:Arial;
}
.glass{
width:320px;
padding:30px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(10px);
border-radius:20px;
color:white;
text-align:center;
border:1px solid rgba(255,255,255,.3);
}
</style>
</head>
<body>

<div class="glass">
<h1>Glass Card</h1>
<p>Modern UI using backdrop-filter.</p>
</div>

</body>
</html>
